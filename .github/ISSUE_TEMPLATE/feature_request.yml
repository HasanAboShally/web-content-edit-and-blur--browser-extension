name: Feature request
description: Suggest something the extension should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation rather than the solution. Knowing the underlying task
        usually leads to a better feature than the one first imagined.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which experience should include this?
      description: >
        Essentials contains common workflows. Advanced contains higher-risk or
        administrative features such as Redact, site rules and import/export.
      options:
        - Essentials — common and broadly useful
        - Advanced — powerful, higher-risk, or administrative
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
      description: Workarounds, other extensions, or why the current tools fall short.
