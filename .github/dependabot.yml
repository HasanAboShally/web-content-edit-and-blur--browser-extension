version: 2
updates:
  # The release workflow depends on third-party publishing actions. Keeping them
  # current matters more here than usual, because a broken one is only discovered
  # at release time.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: ["dependencies"]

  # Runtime stays dependency-free. Playwright drives tests and TypeScript performs
  # no-emit JSDoc checks during development and CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    labels: ["dependencies"]
