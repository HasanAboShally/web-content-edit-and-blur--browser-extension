name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # No browser needed, so this gives fast feedback on the failures that would
      # otherwise present as "the extension does not load".
      - name: Validate manifest and scripts
        run: npm run check

      - name: Typecheck model and geometry
        run: npm run typecheck

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The extension only loads in a headed browser, so drive a virtual display.
      - name: Run test suites
        run: xvfb-run -a npm test

      - name: Test website
        run: npm run test:website

  firefox:
    name: Firefox package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Firefox
        run: npx playwright install --with-deps firefox

      - name: Lint and install the Firefox package
        run: npm run test:firefox

  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Read version from manifest
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: npm run build:all -- "$VERSION"

      # Catches a stray file or a Firefox manifest transform that stopped
      # applying, on every push rather than only when a tag is cut.
      - name: Verify package contents
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/verify-packages.mjs "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 14
