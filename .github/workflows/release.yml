name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match manifest.json)'
        required: false
        type: string
      stores:
        description: 'Which stores to publish to'
        required: true
        default: all
        type: choice
        options: [all, chrome, firefox, edge]
      dry_run:
        description: 'Verify credentials and packages without uploading'
        required: true
        default: true
        type: boolean

# Never cancel a release that is midway through uploading to a store. A
# half-published release is much worse to recover from than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap checks first, so an inconsistent version fails in seconds rather than
  # after a browser download.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # A tag is not allowed to introduce a version. It has to agree with what
      # is committed, otherwise the build would stamp a version that nothing in
      # the repository claims and ship it.
      - name: Release preflight
        env:
          # Via env rather than inline interpolation: a dispatch input is
          # attacker-controllable text, and inline it would be pasted into the
          # script before the shell ever sees it.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            node scripts/preflight.mjs "${GITHUB_REF#refs/tags/}"
          else
            node scripts/preflight.mjs "$INPUT_VERSION"
          fi

      - name: Static checks
        run: npm run check

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The extension only loads in a headed browser, so drive a virtual display.
      - name: Run test suites
        run: xvfb-run -a npm test

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [verify, test]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      stores: ${{ steps.stores.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Preflight has already proved this matches the tag.
      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Select stores
        id: stores
        env:
          # `stores` is a choice input so GitHub constrains it, but keeping the
          # "no interpolation into run:" rule absolute is easier to enforce than
          # a per-case judgement.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STORES: ${{ inputs.stores }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_STORES" = "all" ]; then
            echo 'value=["chrome","firefox","edge"]' >> "$GITHUB_OUTPUT"
          else
            echo "value=[\"$INPUT_STORES\"]" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all targets
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for target in chrome firefox edge; do
            node scripts/build.mjs "$target" "$VERSION"
          done

      - name: Verify package contents
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/verify-packages.mjs "$VERSION"

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.value }}
          tag_name: v${{ steps.version.outputs.value }}
          files: dist/*.zip
          body: |
            ## Content Edit & Blur v${{ steps.version.outputs.value }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for what changed.

            ### Install
            - [Chrome Web Store](https://chrome.google.com/webstore/detail/content-edit-blur/adgnogkndmhcblbonkhgfbbngeghpboh)
            - [Firefox Add-ons](https://addons.mozilla.org/en-US/firefox/addon/content-edit-blur)
            - [Edge Add-ons](https://microsoftedge.microsoft.com/addons/detail/content-edit-blur/chlpcaigaedflhkfgmhkpknlcchkeodl)

            Or download the ZIP for your browser below and load it unpacked.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: dist/*.zip
          retention-days: 14

  # One job per store, so a failure names the store in the UI and can be re-run
  # on its own without re-publishing to the stores that already succeeded.
  publish:
    name: Publish to ${{ matrix.store }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.build.outputs.stores) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/download-artifact@v8
        with:
          name: extension-packages
          path: dist

      # There is deliberately no continue-on-error in this job. A store
      # rejecting an upload has to turn the run red: automation that reports
      # success for a release that never shipped is worse than no automation.
      - name: Publish
        run: |
          node scripts/publish.mjs "$STORE" \
            --version "$VERSION" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          STORE: ${{ matrix.store }}
          VERSION: ${{ needs.build.outputs.version }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          FIREFOX_ADDON_ID: ${{ secrets.FIREFOX_ADDON_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
